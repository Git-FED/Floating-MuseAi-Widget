name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle 8.9 pairs with Android Gradle Plugin 8.7.x.
  # Change this if your project uses a different AGP version.
  GRADLE_VERSION: "8.9"

  # Change to "android", for example, if your Android project
  # is inside an android/ subdirectory.
  PROJECT_DIR: "."

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Android project location
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [[ ! -f settings.gradle && ! -f settings.gradle.kts ]]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in PROJECT_DIR."
            echo "Set PROJECT_DIR to the directory containing your Android project."
            echo "Gradle settings files found in the checkout:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/node_modules/*'
            exit 1
          fi

      - name: Show build environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect debug APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          output_dir="$RUNNER_TEMP/floating-muse-debug-apks"
          mkdir -p "$output_dir"

          if [[ ! -d app/build/outputs/apk ]]; then
            echo "::error::APK output directory was not created."
            exit 1
          fi

          count=0

          while IFS= read -r -d '' apk; do
            relative_path="${apk#app/build/outputs/apk/}"
            destination="$output_dir/$relative_path"

            mkdir -p "$(dirname "$destination")"
            cp "$apk" "$destination"

            echo "Collected: $apk"
            count=$((count + 1))
          done < <(
            find app/build/outputs/apk \
              -type f \
              -path '*/debug/*.apk' \
              -print0
          )

          if [[ "$count" -eq 0 ]]; then
            echo "::error::Build completed but no debug APKs were found."
            exit 1
          fi

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: floating-muse-debug-apk
          path: ${{ runner.temp }}/floating-muse-debug-apks/
          if-no-files-found: error
          retention-days: 14
